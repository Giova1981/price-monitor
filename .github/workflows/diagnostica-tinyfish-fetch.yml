name: Diagnostica TinyFish Fetch

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test TinyFish Fetch
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}

        run: python diagnostica_tinyfish_fetch.py
