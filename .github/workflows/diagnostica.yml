name: Diagnostica Farmasave

on:
  workflow_dispatch:

jobs:
  diagnostica:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui diagnostica Farmasave
        run: python diagnostica.py
