name: Price Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installa Chromium per Playwright
        run: |
          playwright install --with-deps chromium

      - name: Esegui Price Monitor
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}

          ALERT_EMAIL_1: ${{ secrets.EMAIL_MANDARINO }}
          ALERT_EMAIL_2: ${{ secrets.ALERT_EMAIL_ME }}

        run: python monitor.py
