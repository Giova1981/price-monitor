name: Price Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8,13,18,22 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui Price Monitor
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}

          EMAIL_MANDARINO: ${{ secrets.EMAIL_MANDARINO }}
          EMAIL_ME: ${{ secrets.EMAIL_ME }}

        run: python monitor.py

      - name: Salva stato monitor
        run: |
          if [ -f stato.json ]; then
            git config user.name "price-monitor-bot"
            git config user.email "price-monitor-bot@users.noreply.github.com"

            git add stato.json

            if ! git diff --cached --quiet; then
              git commit -m "Aggiorna stato Price Monitor"
              git push
            else
              echo "Nessuna modifica allo stato."
            fi
          fi
